<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4c8ce6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111821",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Family Hub Connect - Profile Setup</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto bg-white dark:bg-slate-900 min-h-screen shadow-xl flex flex-col">
<!-- Top Navigation -->
<div class="flex items-center p-4 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight flex-1 text-center">Step 1: Profile Setup</h2>
<div class="size-10"></div> <!-- Spacer for centering -->
</div>
<!-- Progress Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-4">
<div class="h-2 w-8 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-2 w-2 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-2 w-2 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto px-6 py-4">
<!-- Avatar Section -->
<div class="flex flex-col items-center gap-4 mb-8">
<div class="relative group">
<div class="bg-slate-100 dark:bg-slate-800 bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 border-4 border-primary/20 flex items-center justify-center overflow-hidden" data-alt="Profile photo of a smiling young woman" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD0xBS42VMrP19yG3PDANpHwvrdNsgZB92JXZEqsObx8lEBWjemyiMPbucDN5bUQOrudxBwZi3BtBr3Lq3TbAEeb9UBgeeMQ2T8l3q5lhwn1CKamIOWCjZPyEfcNbqEKktymZvvaZnv-oeVZAtrlJvFePTUz8dk4CQGOOPA7fxOxmrejh0Lo9rP-LKCd-XLohNROMxGEbXc73uvu7PRjRfCjkmV4tRzkvhPA8ykZCoC9j0-KCziRtzyVYYGtiPhR8KMGvrayI_ztAE");'>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-white p-2 rounded-full shadow-lg border-2 border-white dark:border-slate-900 flex items-center justify-center">
<span class="material-symbols-outlined text-sm">photo_camera</span>
</button>
</div>
<div class="text-center">
<h3 class="text-slate-900 dark:text-slate-100 text-xl font-bold">Your Profile Photo</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm">Upload a photo or pick a style</p>
</div>
</div>
<!-- AI Avatar Style Selection -->
<div class="flex gap-2 mb-8 overflow-x-auto pb-2 scrollbar-hide">
<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-primary text-white px-4 cursor-pointer">
<span class="material-symbols-outlined text-[20px]">auto_fix_high</span>
<p class="text-sm font-medium">Default</p>
</div>
<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 cursor-pointer border border-transparent hover:border-primary/30">
<span class="material-symbols-outlined text-[20px]">palette</span>
<p class="text-sm font-medium">Artistic</p>
</div>
<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 cursor-pointer border border-transparent hover:border-primary/30">
<span class="material-symbols-outlined text-[20px]">face_retouching_natural</span>
<p class="text-sm font-medium">Cartoon</p>
</div>
<div class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 cursor-pointer border border-transparent hover:border-primary/30">
<span class="material-symbols-outlined text-[20px]">3d_rotation</span>
<p class="text-sm font-medium">3D Render</p>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-5">
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="Sarah Johnson" type="text" value="Sarah Johnson"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Nickname (Display Name)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">badge</span>
<input class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="e.g. Sarah J." type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Birthday</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">cake</span>
<input class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" type="date"/>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 ml-1">We use this to celebrate your special day!</p>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="p-6 border-t border-slate-100 dark:border-slate-800">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
                Next Step
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-slate-400 text-xs mt-4">Family Hub Connect onboarding</p>
</div>
</div>
</body></html>
