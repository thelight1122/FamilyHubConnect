<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Setup - Step 3</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4c8ce6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111821",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto min-h-screen bg-white dark:bg-slate-900 shadow-xl flex flex-col">
<!-- TopAppBar Component -->
<header class="flex items-center p-4 pb-2 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Profile Setup</h2>
</header>
<!-- Progress Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-5">
<div class="h-2 w-2 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-2 w-2 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-2 w-8 rounded-full bg-primary"></div>
</div>
<!-- Hero Section -->
<div class="px-6 text-center">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-bold leading-tight pb-2 pt-5">Personalization &amp; Themes</h3>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal pb-6">Choose how your dashboard looks and feels, Sarah.</p>
</div>
<main class="flex-1 px-6 overflow-y-auto">
<!-- Theme Selection -->
<section class="mb-8">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight mb-4">App Theme</h3>
<div class="grid grid-cols-3 gap-4">
<!-- Light Mode Option -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="theme" type="radio" value="light"/>
<div class="aspect-[4/5] rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50 peer-checked:border-primary peer-checked:bg-primary/5 p-3 flex flex-col justify-between transition-all">
<div class="flex flex-col gap-2">
<div class="h-2 w-full bg-slate-200 rounded-full"></div>
<div class="h-2 w-2/3 bg-slate-200 rounded-full"></div>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-xl text-slate-500 peer-checked:text-primary">light_mode</span>
<span class="text-xs font-semibold">Light</span>
</div>
</div>
</label>
<!-- Dark Mode Option -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="theme" type="radio" value="dark"/>
<div class="aspect-[4/5] rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-slate-900 peer-checked:border-primary peer-checked:bg-primary/5 p-3 flex flex-col justify-between transition-all">
<div class="flex flex-col gap-2">
<div class="h-2 w-full bg-slate-700 rounded-full"></div>
<div class="h-2 w-2/3 bg-slate-700 rounded-full"></div>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-xl text-slate-400 peer-checked:text-primary">dark_mode</span>
<span class="text-xs font-semibold text-white">Dark</span>
</div>
</div>
</label>
<!-- System Mode Option -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="theme" type="radio" value="system"/>
<div class="aspect-[4/5] rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-gradient-to-br from-slate-50 to-slate-900 peer-checked:border-primary peer-checked:bg-primary/5 p-3 flex flex-col justify-between transition-all">
<div class="flex flex-col gap-2">
<div class="h-2 w-full bg-slate-400/50 rounded-full"></div>
<div class="h-2 w-2/3 bg-slate-400/50 rounded-full"></div>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-xl text-slate-600 peer-checked:text-primary">settings_brightness</span>
<span class="text-xs font-semibold text-slate-700">Auto</span>
</div>
</div>
</label>
</div>
</section>
<!-- Accent Color Selection -->
<section class="mb-10">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight mb-4">Accent Color</h3>
<div class="flex flex-wrap gap-4 justify-between">
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only" name="accent" type="radio" value="blue"/>
<div class="w-10 h-10 rounded-full bg-[#4c8ce6] ring-offset-2 ring-primary peer-checked:ring-2 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100">check</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="accent" type="radio" value="purple"/>
<div class="w-10 h-10 rounded-full bg-[#8b5cf6] ring-offset-2 ring-[#8b5cf6] peer-checked:ring-2 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100">check</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="accent" type="radio" value="rose"/>
<div class="w-10 h-10 rounded-full bg-[#f43f5e] ring-offset-2 ring-[#f43f5e] peer-checked:ring-2 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100">check</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="accent" type="radio" value="emerald"/>
<div class="w-10 h-10 rounded-full bg-[#10b981] ring-offset-2 ring-[#10b981] peer-checked:ring-2 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100">check</span>
</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="accent" type="radio" value="amber"/>
<div class="w-10 h-10 rounded-full bg-[#f59e0b] ring-offset-2 ring-[#f59e0b] peer-checked:ring-2 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100">check</span>
</div>
</label>
<button class="w-10 h-10 rounded-full border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center hover:bg-slate-50 dark:hover:bg-slate-800">
<span class="material-symbols-outlined text-slate-400">add</span>
</button>
</div>
</section>
<!-- Dashboard Preview -->
<section class="mb-8">
<h3 class="text-slate-500 dark:text-slate-400 text-sm font-semibold uppercase tracking-wider mb-3">Live Preview</h3>
<div class="rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden bg-slate-50 dark:bg-slate-800/50 p-4 shadow-sm">
<div class="flex items-center gap-3 mb-4">
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">person</span>
</div>
<div class="flex-1">
<div class="h-3 w-24 bg-slate-200 dark:bg-slate-700 rounded-full mb-2"></div>
<div class="h-2 w-16 bg-slate-100 dark:bg-slate-600 rounded-full"></div>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<div class="h-16 bg-white dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700"></div>
<div class="h-16 bg-primary rounded-lg shadow-lg shadow-primary/20"></div>
</div>
</div>
</section>
</main>
<!-- Footer Actions -->
<footer class="p-6 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/25 transition-all flex items-center justify-center gap-2">
                Finish Setup
                <span class="material-symbols-outlined">check_circle</span>
</button>
<p class="text-center text-slate-400 text-xs mt-4">You can change these settings later in your profile.</p>
</footer>
</div>
</body></html>
