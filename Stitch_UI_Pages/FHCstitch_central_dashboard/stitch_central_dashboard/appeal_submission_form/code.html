<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Family Hub Connect - Submit Appeal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4c8ce6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111821",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full max-w-md mx-auto flex-col bg-white dark:bg-slate-900 overflow-x-hidden shadow-xl">
<!-- TopAppBar Component -->
<div class="flex items-center bg-white dark:bg-slate-900 p-4 border-b border-slate-100 dark:border-slate-800 sticky top-0 z-10">
<div class="text-primary flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-primary/10 cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Submit Appeal</h2>
</div>
<div class="overflow-y-auto flex-1">
<!-- Consequence Details Section -->
<div class="px-4 pt-6 pb-4">
<h3 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] mb-4">Consequence Details</h3>
<div class="p-4 bg-primary/5 dark:bg-primary/10 rounded-xl border border-primary/20">
<div class="flex items-start justify-between gap-4">
<div class="flex flex-col gap-1 flex-1">
<p class="text-primary text-xs font-bold uppercase tracking-wider">Active Consequence</p>
<p class="text-slate-900 dark:text-white text-lg font-bold leading-tight">1-day screen time ban</p>
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal">Reason: Missing curfew by 15 mins</p>
</div>
<div class="w-20 h-20 bg-primary/20 rounded-lg flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-4xl">no_photography</span>
</div>
</div>
</div>
</div>
<div class="px-4 py-2">
<div class="h-px bg-slate-100 dark:bg-slate-800 w-full"></div>
</div>
<!-- Reason for Appeal -->
<div class="px-4 py-3">
<label class="flex flex-col gap-2">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Reason for Appeal</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary min-h-[120px] p-4 text-base font-normal" placeholder="Explain your side of the story here..."></textarea>
</label>
</div>
<!-- Proposed Alternative -->
<div class="px-4 py-3">
<label class="flex flex-col gap-2">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Proposed Alternative</p>
<input class="form-input flex w-full h-12 rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary px-4 text-base font-normal" placeholder="e.g., Extra chore instead" type="text"/>
</label>
</div>
<!-- Impact / Learning -->
<div class="px-4 py-3">
<label class="flex flex-col gap-2">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">What I've learned from this</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-1 focus:ring-primary min-h-[100px] p-4 text-base font-normal" placeholder="Reflect on the situation..."></textarea>
</label>
</div>
<!-- Evidence / Attachments -->
<div class="px-4 py-3 pb-8">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold mb-2">Evidence / Attachments</p>
<div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl p-6 bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 group-hover:text-primary mb-2 text-3xl">upload_file</span>
<p class="text-slate-600 dark:text-slate-400 text-sm">Tap to upload photo or file</p>
<p class="text-slate-400 dark:text-slate-500 text-xs mt-1">(e.g., Proof of finished homework)</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="p-4 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 flex flex-col gap-3">
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl transition-colors shadow-lg shadow-primary/20">
                Submit Appeal
            </button>
<button class="w-full h-12 bg-transparent text-slate-500 dark:text-slate-400 font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">
                Cancel
            </button>
</div>
<div class="h-4 bg-white dark:bg-slate-900"></div>
</div>
</body></html>
