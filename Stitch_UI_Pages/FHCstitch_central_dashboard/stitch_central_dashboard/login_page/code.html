<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#4c8ce6",
                "background-light": "#f6f7f8",
                "background-dark": "#111821",
              },
              fontFamily: {
                "display": ["Plus Jakarta Sans"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="max-w-[480px] w-full bg-white dark:bg-slate-900 rounded-xl shadow-xl overflow-hidden">
<!-- Header/Logo Section -->
<div class="pt-10 pb-6 px-8 text-center">
<div class="flex justify-center mb-6">
<div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="home_heart">home</span>
</div>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Family Hub</h1>
<p class="text-slate-500 dark:text-slate-400 mt-2 text-base">Connect and coordinate with your loved ones securely.</p>
</div>
<div class="px-8 pb-10">
<!-- Login Form -->
<form class="space-y-4">
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="name@family.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
<a class="text-sm font-semibold text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center px-1">
<input class="w-4 h-4 text-primary bg-slate-50 border-slate-300 rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="ml-2 text-sm text-slate-600 dark:text-slate-400" for="remember">Keep me logged in</label>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-slate-900 px-4 text-slate-500 font-medium">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpymxVOR8meoWuw417uCcTm72oNiYEQCPb0SbfGK3EJUOgRjEs6sDy5OSOmEvYyH3rGY83kQBvMUKr_cU-FONlwNEgqZG1pvaFsux15i8NGwSq4YL1soyvB53Gi0cIo6ocLHrvDblpWMOzf7tEid3JI_gQhTdoyaUzzPRbs5E5cFkErbfGKhlhfHNdHjWF8KJKrovsWbQMJCUVrF40dMCenzdcKGrqULplogdDs_Z8D-ronUvX_4r9HGPr5mwIWkcHn7N4BDE1jww"/>
<span class="text-sm font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="apple">ios</span>
<span class="text-sm font-semibold">Apple</span>
</button>
</div>
<!-- Create Account -->
<div class="mt-8 text-center">
<p class="text-slate-600 dark:text-slate-400 text-sm">New to Family Hub?</p>
<button class="mt-3 w-full py-3 px-4 border-2 border-primary/20 text-primary font-bold rounded-lg hover:bg-primary/5 transition-colors">
                    Create Family Account
                </button>
</div>
</div>
<!-- Illustration Footer (Hidden on mobile) -->
<div class="hidden sm:block h-32 bg-primary/5 border-t border-slate-100 dark:border-slate-800">
<div class="w-full h-full bg-[url('https://placeholder.pics/svg/480x128')] bg-cover opacity-40 mix-blend-multiply dark:mix-blend-overlay" data-alt="Soft abstract pattern of family silhouettes and hearts"></div>
</div>
</div>
</body></html>
