<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Family Hub Connect - Core Values</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4c8ce6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111821",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-white dark:bg-slate-900 shadow-xl overflow-x-hidden">
<!-- Header -->
<div class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center">Core Values</h2>
<div class="size-10"></div>
</div>
<!-- Progress Section -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-center">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold uppercase tracking-wider">Onboarding Progress</p>
<p class="text-primary text-sm font-bold">3 of 4</p>
</div>
<div class="h-2 w-full rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 75%;"></div>
</div>
</div>
<!-- Hero Text -->
<div class="px-4 pt-6 pb-4">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-bold leading-tight">Step 3 of 4: Core Values</h3>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed mt-2">
                Select the values that define your family. These will form the foundation of your Family Constitution.
            </p>
</div>
<!-- Values Grid -->
<div class="grid grid-cols-2 gap-4 p-4">
<!-- Kindness -->
<label class="relative flex flex-col gap-3 pb-3 group cursor-pointer">
<input checked="" class="peer absolute top-2 right-2 z-10 h-5 w-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox"/>
<div class="w-full bg-primary/10 dark:bg-primary/20 aspect-square rounded-xl flex items-center justify-center border-2 border-transparent peer-checked:border-primary transition-all group-hover:bg-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">favorite</span>
</div>
<div>
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Kindness</p>
<p class="text-slate-500 dark:text-slate-400 text-xs">Empathy &amp; Care</p>
</div>
</label>
<!-- Respect -->
<label class="relative flex flex-col gap-3 pb-3 group cursor-pointer">
<input checked="" class="peer absolute top-2 right-2 z-10 h-5 w-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox"/>
<div class="w-full bg-primary/10 dark:bg-primary/20 aspect-square rounded-xl flex items-center justify-center border-2 border-transparent peer-checked:border-primary transition-all group-hover:bg-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">handshake</span>
</div>
<div>
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Respect</p>
<p class="text-slate-500 dark:text-slate-400 text-xs">Honor others</p>
</div>
</label>
<!-- Honesty -->
<label class="relative flex flex-col gap-3 pb-3 group cursor-pointer">
<input class="peer absolute top-2 right-2 z-10 h-5 w-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox"/>
<div class="w-full bg-primary/10 dark:bg-primary/20 aspect-square rounded-xl flex items-center justify-center border-2 border-transparent peer-checked:border-primary transition-all group-hover:bg-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">verified_user</span>
</div>
<div>
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Honesty</p>
<p class="text-slate-500 dark:text-slate-400 text-xs">Truthfulness</p>
</div>
</label>
<!-- Curiosity -->
<label class="relative flex flex-col gap-3 pb-3 group cursor-pointer">
<input checked="" class="peer absolute top-2 right-2 z-10 h-5 w-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox"/>
<div class="w-full bg-primary/10 dark:bg-primary/20 aspect-square rounded-xl flex items-center justify-center border-2 border-transparent peer-checked:border-primary transition-all group-hover:bg-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">lightbulb</span>
</div>
<div>
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Curiosity</p>
<p class="text-slate-500 dark:text-slate-400 text-xs">Love of learning</p>
</div>
</label>
<!-- Resilience -->
<label class="relative flex flex-col gap-3 pb-3 group cursor-pointer">
<input class="peer absolute top-2 right-2 z-10 h-5 w-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox"/>
<div class="w-full bg-primary/10 dark:bg-primary/20 aspect-square rounded-xl flex items-center justify-center border-2 border-transparent peer-checked:border-primary transition-all group-hover:bg-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">fitness_center</span>
</div>
<div>
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Resilience</p>
<p class="text-slate-500 dark:text-slate-400 text-xs">Staying strong</p>
</div>
</label>
<!-- Courage -->
<label class="relative flex flex-col gap-3 pb-3 group cursor-pointer">
<input class="peer absolute top-2 right-2 z-10 h-5 w-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox"/>
<div class="w-full bg-primary/10 dark:bg-primary/20 aspect-square rounded-xl flex items-center justify-center border-2 border-transparent peer-checked:border-primary transition-all group-hover:bg-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">shield</span>
</div>
<div>
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Courage</p>
<p class="text-slate-500 dark:text-slate-400 text-xs">Brave actions</p>
</div>
</label>
</div>
<!-- Add Custom Value -->
<div class="px-4 pt-2">
<button class="w-full flex items-center justify-center gap-2 py-4 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 dark:text-slate-400 font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-xl">add_circle</span>
                Add Custom Value
            </button>
</div>
<!-- Footer Navigation -->
<div class="mt-auto p-4 flex gap-3 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 sticky bottom-0">
<button class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                Back
            </button>
<button class="flex-[2] px-4 py-3 rounded-xl bg-primary text-white font-bold hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20">
                Next: Mission Statement
            </button>
</div>
<div class="h-6 bg-white dark:bg-slate-900"></div>
</div>
</body></html>
